<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlet Master - Mobile Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-20">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <div>
                    <h1 class="text-base font-bold leading-tight">Master Outlet</h1>
                    <p class="text-[10px] text-indigo-200">Input Lapangan Sales</p>
                </div>
            </div>
            <div class="text-xs bg-indigo-700 px-3 py-1 rounded-full font-medium" id="total-count">0 Tersimpan (sesi ini)</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 py-4 w-full flex-grow">

        <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center">
                    <svg class="w-4 h-4 mr-1.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Form Input Outlet Baru
                </h2>
                <button type="button" onclick="generateAutoID()" class="text-xs text-indigo-600 font-semibold bg-indigo-50 px-2.5 py-1 rounded-lg">Auto ID</button>
            </div>

            <form id="outlet-form" class="space-y-3.5">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Outlet ID *</label>
                        <input type="text" id="outlet_id" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl bg-slate-50 text-sm font-mono" readonly>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nama Outlet *</label>
                        <input type="text" id="outlet_name" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500" placeholder="Contoh: Toko Berkah">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Owner Name</label>
                        <input type="text" id="owner_name" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="Nama Pemilik">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Phone Number</label>
                        <input type="tel" id="phone_number" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="08xxxxxxxxxx">
                    </div>
                </div>

                <div class="bg-indigo-50/60 p-3.5 rounded-xl border border-indigo-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-bold uppercase text-indigo-900">Lokasi & Titik GPS</label>
                        <button type="button" id="gps-btn" onclick="getLocationGPS()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm flex items-center transition">
                            <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            </svg>
                            Ambil GPS HP Saya
                        </button>
                    </div>

                    <textarea id="address" rows="2" class="w-full px-3 py-2.5 border border-slate-300 bg-white rounded-xl text-sm" placeholder="Alamat otomatis terisi setelah ambil GPS, bisa diedit manual..."></textarea>

                    <input type="text" id="gps_link" class="w-full px-3 py-2 border border-slate-300 bg-white rounded-xl text-xs font-mono text-slate-600" placeholder="Koordinat Maps otomatis terisi atau paste link maps di sini...">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">City / Area</label>
                        <input type="text" id="city" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="Kota">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tipe Outlet</label>
                        <select id="tipe" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white">
                            <option value="Retail">Retail</option>
                            <option value="Grosir">Grosir</option>
                            <option value="Modern Market">Modern Market</option>
                            <option value="Horeca">Horeca</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Kategori</label>
                        <select id="kategori" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white">
                            <option value="Platinum">Platinum</option>
                            <option value="Gold">Gold</option>
                            <option value="Silver" selected>Silver</option>
                            <option value="Bronze">Bronze</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Status</label>
                        <select id="status" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white">
                            <option value="Active" selected>Active</option>
                            <option value="Follow-up">Follow-up</option>
                            <option value="Dormant">Dormant</option>
                            <option value="Lost">Lost</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Sales Rep</label>
                        <input type="text" id="sales_rep" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="Nama Sales">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Join Date</label>
                        <input type="date" id="join_date" class="w-full px-3 py-2.5 border border-slate-200 bg-slate-50 rounded-xl text-sm text-slate-600" readonly>
                    </div>
                </div>

                <!-- Data Kompetitor -->
                <div class="bg-amber-50/60 p-3.5 rounded-xl border border-amber-100 space-y-3">
                    <label class="block text-xs font-bold uppercase text-amber-900">Data Kompetitor Saat Ini</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Brand Dipakai Sekarang</label>
                            <input type="text" id="brand_kompetitor" class="w-full px-3 py-2.5 border border-slate-300 bg-white rounded-xl text-sm" placeholder="Contoh: ABC, Indofood">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Harga Beli Saat Ini</label>
                            <input type="text" id="harga_kompetitor" class="w-full px-3 py-2.5 border border-slate-300 bg-white rounded-xl text-sm" placeholder="Contoh: 25000/botol">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Catatan</label>
                    <input type="text" id="notes" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="Catatan khusus...">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-sm shadow-md flex items-center justify-center space-x-2 mt-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span id="submit-btn-text">Simpan & Masuk Spreadsheet</span>
                </button>
            </form>
        </div>

        <div class="mt-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-900">Riwayat Input Sesi Ini</h3>
            </div>
            <div id="mobile-outlet-list" class="space-y-2 max-h-60 overflow-y-auto">
            </div>
            <p class="text-[10px] text-slate-400 mt-2">Data lengkap & permanen tersimpan di Google Spreadsheet.</p>
        </div>

    </main>

    <div id="notification-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-5 rounded-2xl max-w-xs w-full shadow-xl text-center">
            <h3 id="modal-title" class="text-base font-bold text-slate-900 mb-1">Notifikasi</h3>
            <p id="modal-message" class="text-slate-600 text-xs mb-4">Pesan...</p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-xl text-xs">OK</button>
        </div>
    </div>

    <script>
        // ============================================================
        // GANTI URL INI dengan URL Web App Apps Script Anda
        // Bentuknya: https://script.google.com/macros/s/XXXXXXXXXX/exec
        // ============================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZDQNq7Ub4H2aVcT9ARnPmCwzLTZf7HuaqtqMspbAB8-2ti8-Jc_5Mzx7JI83eHbPF/exec";

        let outlets = [];

        window.onload = function() {
            document.getElementById('join_date').value = new Date().toISOString().split('T')[0];
            generateAutoID();
            renderList();
        }

        function generateAutoID() {
            document.getElementById('outlet_id').value = `OUT-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        function getLocationGPS() {
            if (!navigator.geolocation) {
                showModal('Info', 'GPS tidak didukung perangkat ini.');
                return;
            }

            const gpsBtn = document.getElementById('gps-btn');
            gpsBtn.disabled = true;

            showModal('GPS', 'Mendeteksi titik koordinat GPS...');
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    document.getElementById('gps_link').value = `https://www.google.com/maps?q=${lat},${lon}`;

                    // Panggil Apps Script untuk reverse geocode via fetch (GET)
                    fetch(`${APPS_SCRIPT_URL}?action=geocode&lat=${lat}&lng=${lon}`)
                        .then(res => res.json())
                        .then(result => {
                            gpsBtn.disabled = false;
                            closeModal();
                            if (result.status === 'success') {
                                document.getElementById('address').value = result.address;
                                if (result.city) {
                                    document.getElementById('city').value = result.city;
                                }
                                showModal('Berhasil', 'Titik GPS, alamat & kota berhasil terisi otomatis! Silakan cek dan sesuaikan jika perlu.');
                            } else {
                                showModal('Catatan', 'Titik GPS terkunci, tapi alamat gagal diambil otomatis. Silakan isi alamat secara manual.');
                            }
                        })
                        .catch(err => {
                            gpsBtn.disabled = false;
                            closeModal();
                            showModal('Catatan', 'Titik GPS terkunci, tapi alamat gagal diambil otomatis. Silakan isi alamat secara manual.');
                        });
                },
                (err) => {
                    gpsBtn.disabled = false;
                    closeModal();
                    showModal('Catatan', 'GPS dibatasi browser. Pastikan izin lokasi sudah diaktifkan di Pengaturan HP untuk browser ini.');
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        function showModal(title, msg) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('notification-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('notification-modal').classList.add('hidden');
        }

        document.getElementById('outlet-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const newOutlet = {
                outlet_id: document.getElementById('outlet_id').value.trim(),
                outlet_name: document.getElementById('outlet_name').value.trim(),
                owner_name: document.getElementById('owner_name').value.trim(),
                phone_number: document.getElementById('phone_number').value.trim(),
                address: document.getElementById('address').value.trim(),
                city: document.getElementById('city').value.trim(),
                tipe: document.getElementById('tipe').value,
                kategori: document.getElementById('kategori').value,
                status: document.getElementById('status').value,
                join_date: document.getElementById('join_date').value,
                last_visit: document.getElementById('join_date').value,
                last_order: '-',
                total_orders: 0,
                total_omzet: 0,
                outstanding_balance: 0,
                sales_rep: document.getElementById('sales_rep').value.trim(),
                notes: document.getElementById('notes').value.trim(),
                gps: document.getElementById('gps_link').value.trim(),
                brand_kompetitor: document.getElementById('brand_kompetitor').value.trim(),
                harga_kompetitor: document.getElementById('harga_kompetitor').value.trim()
            };

            if (!newOutlet.outlet_name) {
                showModal('Gagal', 'Nama outlet wajib diisi.');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            const submitBtnText = document.getElementById('submit-btn-text');
            submitBtn.disabled = true;
            submitBtnText.innerText = 'Menyimpan...';

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(newOutlet)
            })
                .then(res => res.json())
                .then(result => {
                    submitBtn.disabled = false;
                    submitBtnText.innerText = 'Simpan & Masuk Spreadsheet';

                    if (result.status === 'success') {
                        outlets.push(newOutlet);
                        renderList();
                        showModal('Sukses', `Outlet ${newOutlet.outlet_name} tersimpan ke spreadsheet!`);

                        document.getElementById('outlet_name').value = '';
                        document.getElementById('owner_name').value = '';
                        document.getElementById('phone_number').value = '';
                        document.getElementById('address').value = '';
                        document.getElementById('city').value = '';
                        document.getElementById('sales_rep').value = '';
                        document.getElementById('notes').value = '';
                        document.getElementById('gps_link').value = '';
                        document.getElementById('brand_kompetitor').value = '';
                        document.getElementById('harga_kompetitor').value = '';
                        generateAutoID();
                    } else {
                        showModal('Gagal', 'Error: ' + result.message);
                    }
                })
                .catch(err => {
                    submitBtn.disabled = false;
                    submitBtnText.innerText = 'Simpan & Masuk Spreadsheet';
                    showModal('Gagal', 'Terjadi kesalahan koneksi: ' + err.message);
                });
        });

        function renderList() {
            const container = document.getElementById('mobile-outlet-list');
            container.innerHTML = '';
            document.getElementById('total-count').innerText = `${outlets.length} Tersimpan (sesi ini)`;

            if (outlets.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">Belum ada outlet diinput sesi ini.</p>';
                return;
            }

            outlets.slice().reverse().forEach((item) => {
                const div = document.createElement('div');
                div.className = 'p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-indigo-600">${item.outlet_id}</span> - <span class="font-medium text-slate-800">${item.outlet_name}</span>
                        <div class="text-slate-500 text-[10px]">${item.city || 'Tanpa Kota'} (${item.status})</div>
                    </div>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">Tersimpan</span>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
